    name: 林砚
    occupation: 敏锐记者
    tagline: "把沉默写成头条的人"
    biography: "曾在上海报馆追查贪腐案，擅长从细节和人的停顿中拼出真相。"
    motivation: "查清旧剪报中被删去的名字，证明失踪案并非意外。"
    manorConnection: "三年前曾采访过庄园捐赠的孤儿院。"
    hpMax: 10
    mpMax: 12
    sanStart: 55
    luckStart: 50
    strengths:
      - { skill: spot_hidden, label: 侦查, rating: 70 }
      - { skill: psychology, label: 心理学, rating: 65 }
      - { skill: persuade, label: 说服, rating: 60 }
    startingItems:
      - { itemId: fountain_pen, name: 钢笔, description: "一支沾着报馆墨水的钢笔。" }
      - { itemId: pocket_camera, name: 小型相机, description: "可记录现场的老式相机。" }
    characteristics: { INT: 75, EDU: 70, DEX: 60, POW: 55, CON: 50, SIZ: 50, APP: 55, STR: 45 }
    skills: { spot_hidden: 70, psychology: 65, persuade: 60, locksmith: 25, dodge: 30 }
