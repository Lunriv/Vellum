moduleId: crimson_rain_manor
version: "1.0.0"
title: 绯雨庄园
openingPrologue: "1927 年深秋，连日暴雨把山路洗成一条黑色的河。你们受邀来到绯雨庄园，调查一封没有署名的委托函，以及庄园主人 Evelyn 夜里不愿提及的失踪案。"
investigators:
