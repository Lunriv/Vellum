    startingItems:
      - { itemId: medical_bag, name: 医药箱, description: "装有绷带、酒精和基础药品。" }
      - { itemId: brass_loupe, name: 黄铜放大镜, description: "用于观察纤维和微小血迹。" }
    characteristics: { INT: 70, EDU: 80, DEX: 50, POW: 60, CON: 50, SIZ: 45, APP: 55, STR: 40 }
    skills: { medicine: 75, science: 60, psychology: 55, spot_hidden: 45, locksmith: 20, dodge: 25 }
initialSceneId: manor_foyer
endings:
  - endingId: expose_the_ritual
    title: 雨幕下的揭露
    summary: "调查员以两条核心结论和现场证据对质，阻止了酒窖仪式。"
    condition:
      all:
        - clue_discovered: conclusion_ritual
        - clue_discovered: conclusion_motive
        - evidence_presented: cellar_ledger_clue
  - endingId: escape_the_manor
    title: 带着证据离开
    summary: "在倒计时结束前带走账本和剪报，庄园的秘密留给后来者。"
    condition:
      all:
        - clue_discovered: cellar_ledger_clue
        - any:
            - clue_discovered: manor_clipping_clue
            - clue_discovered: bloodstained_cuff_clue
reviewFacts:
  - { factId: fact_ritual, title: 仪式真相, detail: "Evelyn 借暴雨和古老家族仪式掩盖了酒窖中的献祭准备。", sourceClueIds: [conclusion_ritual] }
  - { factId: fact_motive, title: 动机, detail: "Evelyn 试图以仪式换回家族声望，Arthur 和 Mary 分别被迫协助与隐瞒。", sourceClueIds: [conclusion_motive] }
  - { factId: fact_missing_guest, title: 失踪者, detail: "三年前的访客并未离开庄园，旧剪报被人为删改。", sourceClueIds: [manor_clipping_clue] }
