    tagline: "见过太多不合常理的现场"
    biography: "在租界巡捕房任职多年，离职后仍保留着谨慎的现场习惯。"
    motivation: "找出一名旧同僚当年未能结案的庄园命案。"
    manorConnection: "旧案卷宗中出现过庄园管家 Arthur 的签名。"
    hpMax: 12
    mpMax: 10
    sanStart: 50
    luckStart: 45
    strengths:
      - { skill: spot_hidden, label: 侦查, rating: 65 }
      - { skill: intimidate, label: 恐吓, rating: 60 }
      - { skill: fighting, label: 格斗, rating: 55 }
    startingItems:
      - { itemId: badge_case, name: 旧警徽盒, description: "一枚退役前留下的警徽。" }
      - { itemId: service_revolver, name: 旧式左轮, description: "登记在册、仅剩少量子弹的左轮手枪。" }
    characteristics: { STR: 65, CON: 60, SIZ: 60, DEX: 55, INT: 60, EDU: 65, POW: 50, APP: 40 }
    skills: { spot_hidden: 65, intimidate: 60, fighting: 55, psychology: 45, locksmith: 35, dodge: 40 }
  - investigatorId: investigator_doctor
    name: 沈清辞
    occupation: 家族医生
    tagline: "能从伤口读出一个人的谎言"
    biography: "受过西医训练，曾为庄园附近的矿工诊治，对异常伤口格外敏感。"
    motivation: "保护病人 Mary，并确认庄园的血迹是否来自活人。"
    manorConnection: "Evelyn 的母亲曾是她在医学院的资助人。"
    hpMax: 10
    mpMax: 14
    sanStart: 60
    luckStart: 55
    strengths:
      - { skill: medicine, label: 医学, rating: 75 }
      - { skill: science, label: 科学, rating: 60 }
