          releasableFactIds: [fact_motive]
          truth: "家族曾经有过一项仪式，但它已经被废弃。"
        - tier: confession
          predicate: { all: [{ clue_discovered: conclusion_ritual }, { clue_discovered: conclusion_motive }] }
          releasableFactIds: [fact_ritual, fact_motive]
          truth: "仪式今晚必须完成，否则庄园的一切都会归于尘土。"
  initialRelations:
